version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadpoint_ai_app
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=leadpoint-super-secret-jwt-key-change-in-production-2026
      - NEXTAUTH_SECRET=leadpoint-nextauth-secret-key-32-chars-minimum
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_DEFAULT_LOCALE=en
      - NEXT_PUBLIC_SUPPORTED_LOCALES=en,es,de,hi,fr
      - TELEPHONY_PROVIDER=vapi
      - VAPI_API_KEY=vapi_mock_sk_live_998877665544332211
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
